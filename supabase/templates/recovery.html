<h2>Reset your password</h2>
<p>
  Someone asked to reset the password for your my-metrics account. If that was
  you, choose a new password here:
</p>
<p>
  <a
    href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery"
    >Choose a new password</a
  >
</p>
<p>
  The link works once and expires after an hour. If you didn't ask for this, you
  can ignore this email; your password stays the same.
</p>
